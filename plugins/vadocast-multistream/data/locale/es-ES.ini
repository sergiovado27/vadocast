# Config dialog
WelcomeTitle="¡Bienvenido a Multistream!"
WelcomeText="Transmite a varias plataformas a la vez.\n\nPara comenzar a configurar las salidas tanto para el lienzo principal como para el lienzo vertical (si usas Vertical), haz clic en uno de los botones a continuación.\n\nSi necesitas ayuda, visita la página de ayuda para obtener más información."
SettingsMainOutputsButton="Salidas principales"
SettingsVerticalOutputsButton="Salidas verticales"
SettingsHelpButton="Ayuda"


# Help Page
HelpTitle="Ayuda con Multistream"
HelpText="Añade una salida por cada plataforma adicional a la que quieras transmitir, en el lienzo principal o en el lienzo vertical.<br /><br />Las salidas que usan el codificador principal o el vertical solo se inician cuando ese lienzo ya está transmitiendo.<br /><br />En los <strong>Ajustes avanzados</strong> de cada salida puedes elegir un codificador propio, la pista de audio y una de las resoluciones de escalado permitidas."

