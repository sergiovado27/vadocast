# Config dialog
WelcomeTitle="Welcome to Multistream!"
WelcomeText="Stream to several platforms at the same time.\n\nTo start configuring your outputs for both the main canvas and the vertical canvas (if you use Vertical), click one of the buttons below.\n\nIf you need help, please visit the help page for more information."
SettingsMainOutputsButton="Main Outputs"
SettingsVerticalOutputsButton="Vertical Outputs"
SettingsHelpButton="Help"


# Help Page
HelpTitle="Getting Help with Multistream"
HelpText="Add an output for every extra platform you want to stream to, on the main canvas or on the vertical canvas.<br /><br />Outputs that use the main or vertical encoder only start while that canvas is already streaming.<br /><br />The <strong>Advanced Settings</strong> of each output let you choose a separate encoder, audio track and an allowed scaled resolution."

# Main canvas
SettingsMainCanvasTitle="Main Canvas"
SettingsMainCanvasDescription="You can manage your Main Canvas (the default canvas) settings here. \nPlease note that to change your Built-in Output settings, you need to do this from within the normal settings."

